<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .progress-bar-animated {
            -webkit-animation: progress-bar-stripes 1s linear infinite;
            animation: progress-bar-stripes 1s linear infinite;
        }
        .progress-bar-striped {
            background-image: linear-gradient(45deg, hsla(0, 0%, 100%, .15) 25%, transparent 0, transparent 50%, hsla(0, 0%, 100%, .15) 0, hsla(0, 0%, 100%, .15) 75%, transparent 0, transparent);
            background-size: 1rem 1rem;
        }
        .progress-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            background-color: #e95420;
            transition: width .6s ease;
            height: 20px;
            width: 0%;
        }
        .progress {
            width: 100%;
            background-color: #ddd;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100 p-4">
    <div class="bg-white p-6 rounded-lg shadow-lg text-center w-full max-w-2xl">
        <h1 class="text-xl font-semibold mb-4">UUID Generator</h1>
        <p id="previous-uuid" class="text-sm text-gray-500 mb-2">Previous UUID: None</p>
        <p id="uuid" class="text-sm bg-gray-200 p-3 rounded-md break-all">Click to generate UUID</p>
        <div class="mt-4 space-x-2 flex justify-center">
            <button onclick="generateUUID()" class="px-4 py-2 bg-blue-500 text-white rounded-md">Generate</button>
            <button onclick="copyToClipboard()" class="px-4 py-2 bg-green-500 text-white rounded-md">Copy</button>
            <button onclick="refreshPage()" class="px-4 py-2 bg-gray-500 text-white rounded-md">Refresh</button>
        </div>
        
        <div class="mt-6">
            <label for="uuidCount" class="block text-sm font-medium">Generate Multiple</label>
            <input type="number" id="uuidCount" min="1" max="1000" placeholder="Max 1000" class="mt-1 p-2 border rounded-md w-full text-center">
            <button onclick="generateBulkUUIDs()" class="mt-3 w-full px-4 py-2 bg-purple-500 text-white rounded-md">Generate Bulk</button>
            <button onclick="downloadUUIDs()" class="mt-2 w-full px-4 py-2 bg-red-500 text-white rounded-md">Download</button>
        </div>
        
        <div class="progress hidden" id="progressContainer">
            <div class="progress-bar progress-bar-striped progress-bar-animated" id="progressBar">0%</div>
        </div>

        <textarea id="bulkUUIDs" class="mt-4 p-3 w-full h-32 bg-gray-200 rounded-md hidden" readonly></textarea>
    </div>
    <div id="notification" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-md text-sm hidden"></div>

    <script>
        function showNotification(message, success = false) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `fixed bottom-4 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-md text-sm text-white ${success ? 'bg-green-500' : 'bg-gray-800'}`;
            notification.classList.remove('hidden');
            setTimeout(() => notification.classList.add('hidden'), 3000);
        }

        function generateUUID() {
            const previousUUID = document.getElementById('uuid').textContent;
            document.getElementById('previous-uuid').textContent = `Previous UUID: ${previousUUID}`;
            document.getElementById('uuid').textContent = crypto.randomUUID();
            showNotification('UUID Generated');
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(document.getElementById('uuid').textContent).then(() => {
                showNotification('Copied to clipboard ✅', true);
            });
        }

        function generateBulkUUIDs() {
            const count = parseInt(document.getElementById('uuidCount').value) || 1;
            if (count > 1000 || count < 1) return showNotification('Enter 1-1000!', false);
            
            const progressBar = document.getElementById('progressBar');
            const progressContainer = document.getElementById('progressContainer');
            progressContainer.classList.remove('hidden');
            
            let generated = 0;
            const uuids = [];
            
            function generateStep() {
                if (generated < count) {
                    uuids.push(crypto.randomUUID());
                    generated++;
                    progressBar.style.width = `${(generated / count) * 100}%`;
                    progressBar.textContent = `${Math.round((generated / count) * 100)}%`;
                    requestAnimationFrame(generateStep);
                } else {
                    document.getElementById('bulkUUIDs').value = uuids.join('\n');
                    document.getElementById('bulkUUIDs').classList.remove('hidden');
                    progressContainer.classList.add('hidden');
                    showNotification(`${count} UUIDs Generated`, true);
                }
            }
            requestAnimationFrame(generateStep);
        }

        function downloadUUIDs() {
            const text = document.getElementById('bulkUUIDs').value;
            if (!text) return showNotification('No UUIDs to download', false);
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
            link.download = 'uuids.txt';
            link.click();
            showNotification('UUIDs Downloaded', true);
        }

        function refreshPage() {
            location.reload();
        }
    </script>
</body>
</html>
